name: Build & Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.23']
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: |
          CGO_ENABLED=0 go build -ldflags="-s -w" -o wsl-dev-setup .

      - name: Test
        run: go test ./... -v

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: wsl-dev-setup-${{ matrix.os }}
          path: wsl-dev-setup*
          retention-days: 7

  test-integration:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Run integration tests
        run: |
          CGO_ENABLED=0 go build -ldflags="-s -w" -o wsl-dev-setup .
          ./wsl-dev-setup doctor
          ./wsl-dev-setup install --dry-run --skip-system-base --skip-fonts --skip-opencode --skip-chsh --skip-omz --skip-cli-tools